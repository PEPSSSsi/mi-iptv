name: Actualizar Lista IPTV

on:
  schedule:
    - cron: '0 6 * * *'   # Todos los días a las 06:00 UTC (≈ 3:00 AM Chile)
  workflow_dispatch:       # Botón para ejecutarlo a mano

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar filtro
        run: python filtrar.py

      - name: Guardar lista actualizada en el repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add espanol_filtrado.m3u
          git diff --staged --quiet || git commit -m "Lista actualizada automáticamente"
          git push
